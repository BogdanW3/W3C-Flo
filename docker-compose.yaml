services:
  postgres:
    container_name: flo_psql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: md5
    image: postgres:13-alpine
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    restart: always

  node:
    container_name: flo-node
    build:
      context: .
      dockerfile: build/node.Dockerfile
      args:
        BUILD_MODE: debug
    volumes:
      - ./.env:/usr/local/s2/.env
    depends_on:
      - postgres
    ports:
      - '127.0.0.1:3552:3552/udp'
      - '127.0.0.1:3553:3553'
      - '127.0.0.1:3554:3554/tcp'
      - '127.0.0.1:3555:3555'
    env_file:
      - .env

  controller:
    container_name: flo-controller
    build:
      context: .
      dockerfile: build/controller.Dockerfile
      args:
        BUILD_MODE: debug
    volumes:
      - ./.env:/usr/local/s2/.env
    depends_on:
      - postgres
      - node
    ports:
     - '127.0.0.1:3549:3549'
     - '127.0.0.1:3550:3550'
    env_file:
      - .env

volumes:
  database:
